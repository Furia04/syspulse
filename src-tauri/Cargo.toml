[package]
name = "syspulse"
version = "0.1.0"
description = "SysPulse - Real-time System Monitor & Local Diagnostic Tool"
authors = ["SysPulse Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "syspulse_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-notification = "2"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
